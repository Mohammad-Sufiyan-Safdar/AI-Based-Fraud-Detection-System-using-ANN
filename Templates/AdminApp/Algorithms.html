<!DOCTYPE html>
{%load static%}
<html>
<head>
<meta charset="utf-8">
<title>ANN Model Result</title>

<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.1/css/bootstrap.min.css">
<link href="https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700" rel="stylesheet">

<style>

body{
font-family:Poppins;
background:#f5f7fb;
}

/* Navbar */

.navbar{
background:linear-gradient(45deg,#0f2027,#203a43,#2c5364);
}

.navbar .nav-link{
color:white;
font-weight:500;
margin-left:15px;
}

.navbar .nav-link:hover{
color:#ffd369;
}

/* Banner */

.banner{
background:linear-gradient(120deg,#1a2a6c,#b21f1f,#fdbb2d);
padding:80px 0;
color:white;
}

/* Result Card */

.model-card{
background:white;
padding:40px;
border-radius:12px;
box-shadow:0 10px 30px rgba(0,0,0,0.1);
text-align:center;
margin-top:40px;
}

.model-card h3{
font-weight:600;
margin-bottom:20px;
}

.model-result{
font-size:22px;
color:#2c5364;
font-weight:600;
margin-bottom:15px;
}

.model-accuracy{
font-size:35px;
color:#e74c3c;
font-weight:700;
}

</style>

</head>

<body>

<!-- Navbar -->

<nav class="navbar navbar-expand-lg">
<div class="container">

<div class="collapse navbar-collapse">

<ul class="navbar-nav ml-auto">

<li class="nav-item"><a class="nav-link" href="/AdminHome">Home</a></li>
<li class="nav-item"><a class="nav-link" href="/Upload">Upload Dataset</a></li>
<li class="nav-item"><a class="nav-link" href="/preprocess">Preprocess</a></li>
<li class="nav-item"><a class="nav-link" href="/runANN">Generate ANN Model</a></li>
<li class="nav-item"><a class="nav-link" href="/">Logout</a></li>

</ul>

</div>
</div>
</nav>

<!-- Banner -->

<section class="banner text-center">

<div class="container">

<h2>Artificial Neural Network Model Training</h2>
<p>Fraud Detection in Indian Businesses</p>

</div>

</section>


<!-- Model Result Section -->

<section class="container">

<div class="model-card">

<h3>Model Training Result</h3>

<div class="model-result">
{{data}}
</div>

<h4>Model Accuracy</h4>

<div class="model-accuracy">
{{acc}} %
</div>

</div>

</section>


<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.1/js/bootstrap.min.js"></script>

</body>
</html>
