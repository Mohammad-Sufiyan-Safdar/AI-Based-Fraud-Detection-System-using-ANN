<!DOCTYPE html>
{%load static%}
<html>
<head>
<meta charset="utf-8">
<title>Upload Dataset</title>

<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.1/css/bootstrap.min.css">
<link href="https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700" rel="stylesheet">
<link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.1.0/css/all.css">

<style>

body{
font-family:Poppins;
background:#f5f7fb;
}

/* Navbar */

.navbar{
background:linear-gradient(45deg,#0f2027,#203a43,#2c5364);
box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

.navbar .nav-link{
color:white;
font-weight:500;
margin-left:15px;
}

.navbar .nav-link:hover{
color:#ffd369;
}

/* Banner */

.banner{
background:linear-gradient(120deg,#1a2a6c,#b21f1f,#fdbb2d);
padding:100px 0;
color:white;
}

.banner h2{
font-weight:700;
}

/* Upload Section */

.upload-section{
padding:70px 0;
}

.upload-card{
background:white;
padding:40px;
border-radius:12px;
box-shadow:0 10px 30px rgba(0,0,0,0.1);
max-width:500px;
margin:auto;
text-align:center;
}

.upload-card h3{
font-weight:600;
margin-bottom:20px;
}

/* File input */

.file-input{
border:2px dashed #ccc;
padding:20px;
border-radius:10px;
margin-bottom:20px;
}

/* Buttons */

.btn-upload{
background:#2c5364;
color:white;
border:none;
padding:10px 25px;
border-radius:6px;
margin:5px;
}

.btn-reset{
background:#6c757d;
color:white;
border:none;
padding:10px 25px;
border-radius:6px;
margin:5px;
}

.btn-upload:hover{
background:#203a43;
}

.btn-reset:hover{
background:#5a6268;
}

</style>

</head>

<body>

<!-- Navbar -->

<nav class="navbar navbar-expand-lg">

<div class="container">

<button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent">
<span class="fas fa-bars"></span>
</button>

<div class="collapse navbar-collapse" id="navbarSupportedContent">

<ul class="navbar-nav ml-auto">

<li class="nav-item">
<a class="nav-link" href="/AdminHome">Home</a>
</li>

<li class="nav-item">
<a class="nav-link" href="/Upload">Upload Dataset</a>
</li>

<li class="nav-item">
<a class="nav-link" href="/preprocess">Preprocess</a>
</li>

<li class="nav-item">
<a class="nav-link" href="/runANN">Generate ANN Model</a>
</li>

<li class="nav-item">
<a class="nav-link" href="/">Logout</a>
</li>

</ul>

</div>
</div>
</nav>


<!-- Banner -->

<section class="banner">

<div class="container text-center">

<h2>Fraud Detection Dataset Upload</h2>

<p>Upload your dataset to start the training process</p>

</div>

</section>


<!-- Upload Section -->

<section class="upload-section">

<div class="container">

<div class="upload-card">

<h3>Upload Dataset</h3>

<form action="/UploadAction" method="post" enctype="multipart/form-data">

{%csrf_token%}

<div class="file-input">

<i class="fas fa-file-upload fa-2x"></i>

<br><br>

<input type="file" name="dataset" required>

</div>

<input type="submit" value="Upload Dataset" class="btn-upload">

<input type="reset" value="Reset" class="btn-reset">

</form>

</div>

</div>

</section>


<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.1/js/bootstrap.min.js"></script>

</body>
</html>
