<!DOCTYPE html>
{%load static%}
<html>
<head>
<meta charset="utf-8">
<title>User Register</title>

<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.1/css/bootstrap.min.css">
<link href="https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700" rel="stylesheet">

<style>

body{
font-family:Poppins;
background:#f5f7fb;
}

/* Navbar */

.navbar{
background:linear-gradient(45deg,#0f2027,#203a43,#2c5364);
box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

.navbar .nav-link{
color:white;
font-weight:500;
margin-left:15px;
}

.navbar .nav-link:hover{
color:#ffd369;
}

/* Banner */

.banner{
background:linear-gradient(120deg,#1a2a6c,#b21f1f,#fdbb2d);
padding:120px 0;
color:white;
}

.banner h2{
font-weight:700;
font-size:36px;
}

.banner h6{
font-size:18px;
opacity:.9;
}

.banner img{
border-radius:12px;
box-shadow:0 8px 20px rgba(0,0,0,0.3);
}

/* Register Section */

.about{
padding:80px 0;
}

.register-card{
background:white;
padding:35px;
border-radius:12px;
box-shadow:0 10px 30px rgba(0,0,0,0.1);
max-width:500px;
margin:auto;
margin-top:20px;
}

.register-card h3{
text-align:center;
margin-bottom:25px;
font-weight:600;
color:#2c3e50;
}

.register-card input{
width:100%;
padding:10px;
border:1px solid #ccc;
border-radius:6px;
margin-bottom:15px;
}

/* Buttons */

.btn-register{
background:#2c5364;
color:white;
border:none;
padding:10px;
width:48%;
border-radius:6px;
}

.btn-reset{
background:#6c757d;
color:white;
border:none;
padding:10px;
width:48%;
border-radius:6px;
}

.btn-register:hover{
background:#203a43;
}

.btn-reset:hover{
background:#5a6268;
}

.login-link{
text-align:center;
margin-top:15px;
}

.login-link a{
color:#1a2a6c;
font-weight:500;
}

.error{
text-align:center;
color:red;
margin-bottom:10px;
}

</style>

</head>

<body>

<!-- Navbar -->

<nav class="navbar navbar-expand-lg">

<div class="container">

<button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent">
<span class="fas fa-bars"></span>
</button>

<div class="collapse navbar-collapse" id="navbarSupportedContent">

<ul class="navbar-nav ml-auto">

<li class="nav-item">
<a class="nav-link" href="/">Home</a>
</li>

<li class="nav-item">
<a class="nav-link" href="/">Admin</a>
</li>

<li class="nav-item">
<a class="nav-link" href="/userapp/login">User</a>
</li>

</ul>

</div>
</div>
</nav>


<!-- Banner -->

<section class="banner">

<div class="container">

<div class="row align-items-center">

<div class="col-md-7">

<h2>Impact of Cyber Security and Forensic Accounting Techniques</h2>
<h6>on Fraud Detection in Indian Businesses</h6>

</div>

<div class="col-md-5 text-center">

<img src="{%static 'images/img2.jpg'%}" class="img-fluid">

</div>

</div>

</div>

</section>


<!-- Register Section -->

<section class="about">

<div class="container">

<div class="register-card">

<h3>User Register</h3>

<div class="error">{{data}}</div>

<form action="/userapp/RegAction" method="post">
{%csrf_token%}

<input type="text" name="name" placeholder="Enter Name" required>

<input type="email" name="email" placeholder="Enter Email" required>

<input type="text" name="mobile" placeholder="Enter Mobile Number" required>

<input type="text" name="address" placeholder="Enter Address" required>

<input type="text" name="username" placeholder="Enter Username" required>

<input type="password" name="password" placeholder="Enter Password" required>

<div style="display:flex;justify-content:space-between;">

<input type="submit" value="Register" class="btn-register">

<input type="reset" value="Reset" class="btn-reset">

</div>

</form>

<div class="login-link">

Already have an account?  
<a href="/userapp/login">Login</a>

</div>

</div>

</div>

</section>


<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.1/js/bootstrap.min.js"></script>

</body>
</html>
